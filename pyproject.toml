[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-overclaim"
version = "0.0.1"
description = "Measuring overclaiming rates of LLM agents with decoy tasks (falsify-based empirical study)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wenjie Zhang" }]
keywords = ["llm-evaluation", "overclaiming", "decoy-tasks", "calibration", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "falsify @ git+https://github.com/LAZARUSj/falsify.git",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/LAZARUSj/agent-overclaim"
Issues = "https://github.com/LAZARUSj/agent-overclaim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_overclaim = ["data/*.jsonl"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
